<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>BakeSmart2D</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #2b1a0d;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
      }
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #orientation-lock {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: calc(24px + env(safe-area-inset-top, 0px))
          calc(24px + env(safe-area-inset-right, 0px))
          calc(24px + env(safe-area-inset-bottom, 0px))
          calc(24px + env(safe-area-inset-left, 0px));
        background: radial-gradient(circle at top, #fff8ed 0%, #f5dfbd 68%, #c98a4b 100%);
        color: #40260f;
        text-align: center;
        user-select: none;
        touch-action: none;
      }
      #orientation-lock[hidden] {
        display: none;
      }
      .orientation-card {
        width: min(420px, 88vw);
        padding: 28px 26px 26px;
        border: 2px solid #d8bf92;
        border-radius: 28px;
        background: #fffbf3;
        box-shadow: 0 12px 0 rgb(64 38 15 / 14%);
      }
      .orientation-phone {
        position: relative;
        width: 54px;
        height: 92px;
        margin: 0 auto 18px;
        border: 6px solid #a96b33;
        border-radius: 14px;
        transform: rotate(90deg);
      }
      .orientation-phone::after {
        content: "";
        position: absolute;
        right: 5px;
        top: 50%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d97b29;
        transform: translateY(-50%);
      }
      .orientation-brand {
        margin-bottom: 8px;
        color: #d97b29;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .orientation-title {
        margin: 0 0 10px;
        font-size: clamp(26px, 7vw, 36px);
      }
      .orientation-copy {
        margin: 0;
        color: #7d6247;
        font-size: 17px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="orientation-lock" role="dialog" aria-modal="true" aria-hidden="true" hidden>
      <div class="orientation-card">
        <div class="orientation-phone" aria-hidden="true"></div>
        <div class="orientation-brand">BAKESMART2D</div>
        <h1 class="orientation-title">Rotate your device</h1>
        <p class="orientation-copy">BakeSmart2D is designed for landscape play. Your current lesson will stay right where it is.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
